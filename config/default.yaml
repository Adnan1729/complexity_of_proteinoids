# Default configuration for the proteinoid complexity pipeline.
# Override any of these on the command line or by pointing to a different config file.

paths:
  raw_data: data/raw/img_nodes_2.xlsx
  outputs_root: data/outputs

empirical:
  sheet_names:
    - img1
    - img2
    - img3
    - img4
    - saksham_img1
    - saksham_img2

# Map internal xlsx sheet names to the paper's figure panel labels.
# Used by depercolation sweep + midpoint-analysis plots so figures in
# the paper (Section V, Appendix A) use consistent naming with Figs 2 and 4.
sheet_label_map:
  img1: "Fig. 2(c)"
  img2: "Fig. 2(d)"
  img3: "Fig. 2(b)"
  img4: "Fig. 2(a)"
  saksham_img1: "Fig. 4(a)"
  saksham_img2: "Fig. 4(b)"

depercolation:
  # Fraction of edges randomly removed to measure the depercolation ratio.
  edge_removal_fraction: 0.9
  # Whether to compute depercolation on the empirical graph, the fresh
  # Delaunay triangulation of the empirical node set, or both.
  # Options: "empirical", "fresh_delaunay", "both"
  mode: both

random_sweep:
  num_iterations: 19
  p_values_start: 0.5
  p_values_end: 0.9
  p_values_count: 10
  min_nodes: 90
  max_nodes: 100
  scale: 1200

scaled_up:
  num_iterations: 5
  min_nodes: 60
  max_nodes: 100
  scale: 1200

reproducibility:
  seed: 42

empirical_deperc_sweep:
  p_min: 0.05
  p_max: 0.95
  n_steps: 19
  n_realizations: 50
